name: evil_space
description: "Evil Space coworking web app for Nha Trang, Vietnam."
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/slideshow/
    - assets/backgrounds/home/
    - assets/backgrounds/feed/
    - assets/backgrounds/desks/
    - assets/backgrounds/office/
    - assets/backgrounds/studio/
    - assets/backgrounds/contact/
    - assets/content/
