name: Fix release test failures

on:
  push:
    branches:
      - feature/kindle-admin-foundation
    paths:
      - .github/workflows/fix-release-tests.yml

permissions:
  contents: write

jobs:
  capture-residual-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kindle-admin-foundation

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply analyzer lint fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/app_shell.dart')
          text = path.read_text()
          old = "    if (value >= 1000000)\n      return '${(value / 1000000).toStringAsFixed(1)} MLN VND';"
          new = "    if (value >= 1000000) {\n      return '${(value / 1000000).toStringAsFixed(1)} MLN VND';\n    }"
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          dart format lib/app_shell.dart
          rm -f .repair-analyze.txt .repair-test.txt

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Capture test result and commit current repair
        shell: bash
        run: |
          set +e
          flutter test --no-pub 2>&1 | tee .repair-test.txt
          status=${PIPESTATUS[0]}
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib/app_shell.dart .repair-analyze.txt .repair-test.txt
          git commit -m "Capture residual release test failure"
          git push origin HEAD:feature/kindle-admin-foundation
          exit $status
