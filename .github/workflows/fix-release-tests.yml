name: Fix release test failures

on:
  push:
    branches:
      - feature/kindle-admin-foundation
    paths:
      - .github/workflows/fix-release-tests.yml

permissions:
  contents: write

jobs:
  verify-and-finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kindle-admin-foundation

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Fix final analyzer lint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/app_shell.dart')
          text = path.read_text()
          old = "    if (value >= 1000000)\n      return '${(value / 1000000).toStringAsFixed(1)} MLN VND';"
          new = "    if (value >= 1000000) {\n      return '${(value / 1000000).toStringAsFixed(1)} MLN VND';\n    }"
          if old not in text:
              raise SystemExit('target money-label lint not found')
          path.write_text(text.replace(old, new, 1))
          PY
          dart format lib/app_shell.dart
          rm -f .repair-analyze.txt

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Worker syntax and helpers
        run: |
          node --check worker/index.js
          node --check worker/entry.js
          node --check worker/telegram.js
          node --check worker/booking_rules.js
          node --test worker/telegram_test.mjs worker/booking_rules_test.mjs

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build optimized Wasm web
        run: flutter build web --release --wasm --no-pub --dart-define=EVIL_SPACE_ADMIN_PREVIEW=true

      - name: Verify release
        run: |
          node --check build/web/flutter_bootstrap.js
          dart run tool/verify_release.dart build/web

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib/app_shell.dart .repair-analyze.txt
          git commit -m "Finish release test repair"
          git push origin HEAD:feature/kindle-admin-foundation
