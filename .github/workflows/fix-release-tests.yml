name: Fix release test failures

on:
  push:
    branches:
      - feature/kindle-admin-foundation
    paths:
      - .github/workflows/fix-release-tests.yml

permissions:
  contents: write

jobs:
  verify-final-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kindle-admin-foundation

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Patch responsive booking button and smoke test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('lib/app_shell.dart')
          text = app.read_text()
          old = "            Text(detail, style: _serif(19, color: foreground)),"
          new = "            Flexible(\n              flex: 2,\n              child: Text(\n                detail,\n                textAlign: TextAlign.right,\n                style: _serif(19, color: foreground),\n              ),\n            ),"
          if old not in text:
              raise SystemExit('paper button detail target not found')
          app.write_text(text.replace(old, new, 1))
          smoke = Path('test/web_app_smoke_test.dart')
          text = smoke.read_text()
          old = "    expect(find.text('TODAY'), findsOneWidget);\n    await tester.tap(find.text('TODAY'));\n    await tester.pumpAndSettle();"
          new = "    final todayButton = find.text('TODAY');\n    expect(todayButton, findsOneWidget);\n    await tester.ensureVisible(todayButton);\n    await tester.pumpAndSettle();\n    await tester.tap(todayButton);\n    await tester.pumpAndSettle();"
          if old not in text:
              raise SystemExit('smoke-test TODAY tap target not found')
          smoke.write_text(text.replace(old, new, 1))
          PY
          dart format lib/app_shell.dart test/web_app_smoke_test.dart
          rm -f .repair-test.txt .repair-analyze.txt

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Worker syntax and helpers
        run: |
          node --check worker/index.js
          node --check worker/entry.js
          node --check worker/telegram.js
          node --check worker/booking_rules.js
          node --test worker/telegram_test.mjs worker/booking_rules_test.mjs

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build optimized Wasm web
        run: flutter build web --release --wasm --no-pub --dart-define=EVIL_SPACE_ADMIN_PREVIEW=true

      - name: Verify release
        run: |
          node --check build/web/flutter_bootstrap.js
          dart run tool/verify_release.dart build/web

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix responsive public booking release tests"
          git push origin HEAD:feature/kindle-admin-foundation
