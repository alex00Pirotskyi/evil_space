name: Implement admin pricing and promotions

on:
  push:
    branches:
      - feature/kindle-admin-foundation
    paths:
      - .github/workflows/implement-pricing-promotions.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kindle-admin-foundation

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Complete Telegram pricing patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/implement_pricing_promotions.py')
          text = path.read_text()
          needle = "text = text.replace(\"    .bind(name, membership.id, MONTH_PASS_VND, now, admin.email, customer.id)\", \"    .bind(name, membership.id, (await resolvePricing(env, serviceDayForOffset(0, now), now)).monthPassVnd, now, admin.email, customer.id)\", 1)"
          addition = needle + "\ntext = text.replace(\"  const todayPrice = dayPassAmount(serviceDayForOffset(0, now), now);\", \"  const pricing = await resolvePricing(env, serviceDayForOffset(0, now), now);\", 1)\ntext = text.replace(\"${isMonth ? '2.5 MLN VND' : formatMoney(todayPrice)}\", \"${formatMoney(isMonth ? pricing.monthPassVnd : pricing.dayPassVnd)}\", 1)"
          if needle not in text:
              raise SystemExit('Telegram pricing insertion point missing')
          path.write_text(text.replace(needle, addition, 1))
          PY

      - name: Implement dynamic pricing and promotions
        run: python3 .github/implement_pricing_promotions.py

      - name: Update dynamic pricing contract tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/telegram_start_booking_contract_test.dart')
          text = path.read_text()
          old = "    expect(bookingFlow, contains('dayPassAmount(serviceDay, now)'));"
          new = "    expect(bookingFlow, contains('resolvePricing(env, serviceDay, now)'));"
          if old not in text:
              raise SystemExit('stale Telegram start pricing assertion not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('test/telegram_contract_test.dart')
          text = path.read_text()
          old = '''    test('booking prices come from the shared Nha Trang rules', () {
      expect(bookingRules, contains('export const DAY_PASS_VND = 200000;'));
      expect(bookingRules, contains('export const HALF_DAY_VND = 100000;'));
      expect(bookingRules, contains('export const MONTH_PASS_VND = 2500000;'));
      expect(
        worker,
        contains('dayPassAmount(serviceDayForOffset(0, now), now)'),
      );
      expect(
        telegram,
        contains('dayPassAmount(serviceDayForOffset(0, now), now)'),
      );
      expect(worker, isNot(contains('250K VND')));
      expect(telegram, isNot(contains('250K VND')));
    });'''
          new = '''    test('booking prices come from editable pricing and promotion rules', () {
      final pricing = File('worker/pricing.js').readAsStringSync();
      final pricingMigration = File(
        'migrations/0009_pricing_promotions.sql',
      ).readAsStringSync();
      expect(pricing, contains('DEFAULT_DAY_PASS_VND = 200000'));
      expect(pricing, contains('resolvePricing'));
      expect(pricing, contains('promotionApplies'));
      expect(pricingMigration, contains('pricing_settings'));
      expect(pricingMigration, contains('promotions'));
      expect(entry, contains('resolvePricing(env, serviceDay, now)'));
      expect(worker, contains('resolvePricing(env, serviceDayForOffset(0, now), now)'));
      expect(telegram, contains('resolvePricing(env, serviceDay, now)'));
      expect(bookingRules, isNot(contains('HALF_DAY_VND')));
      expect(worker, isNot(contains('250K VND')));
      expect(telegram, isNot(contains('250K VND')));
    });'''
          if old not in text:
              raise SystemExit('stale shared pricing contract block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format touched Dart files
        run: |
          dart format \
            lib/admin_api_models.dart \
            lib/admin_api_stub.dart \
            lib/admin_api_web.dart \
            lib/admin_screen.dart \
            lib/app_shell.dart \
            lib/coworking_model.dart \
            lib/localization.dart \
            test/booking_service_day_contract_test.dart \
            test/telegram_contract_test.dart \
            test/telegram_start_booking_contract_test.dart \
            test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Check Worker syntax
        run: |
          node --check worker/index.js
          node --check worker/entry.js
          node --check worker/telegram.js
          node --check worker/booking_rules.js
          node --check worker/pricing.js

      - name: Test Worker helpers
        run: node --test worker/telegram_test.mjs worker/booking_rules_test.mjs worker/pricing_test.mjs

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test Flutter
        run: flutter test --no-pub

      - name: Build optimized Wasm web
        run: flutter build web --release --wasm --no-pub --dart-define=EVIL_SPACE_ADMIN_PREVIEW=true

      - name: Verify release
        run: |
          node --check build/web/flutter_bootstrap.js
          dart run tool/verify_release.dart build/web

      - name: Commit verified feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add admin pricing and scheduled promotions"
          git push origin HEAD:feature/kindle-admin-foundation
