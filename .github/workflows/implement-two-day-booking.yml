} from './booking_rules.js';
""" + text
          for old in [
              'const DAY_PASS_VND = 200000;\n',
              'const MONTH_PASS_VND = 2500000;\n',
          ]:
              text = replace_once(text, old, '', f'telegram remove {old.strip()}')
          text = text.replace('const CUSTOMER_LINK_TTL = 6 * 60 * 60;', 'const CUSTOMER_LINK_TTL = 30 * 60 * 60;')

          # Translation additions and generic accepted copy.
          replacements = {
              "    today: 'TODAY',\n": "    today: 'TODAY',\n    tomorrow: 'TOMORROW',\n    date: 'Date',\n    price: 'Price',\n    halfDay: 'HALF DAY · AFTER 16:00',\n",
              "    today: 'СЕГОДНЯ',\n": "    today: 'СЕГОДНЯ',\n    tomorrow: 'ЗАВТРА',\n    date: 'Дата',\n    price: 'Цена',\n    halfDay: 'ПОЛДНЯ · ПОСЛЕ 16:00',\n",
              "    today: 'HÔM NAY',\n": "    today: 'HÔM NAY',\n    tomorrow: 'NGÀY MAI',\n    date: 'Ngày',\n    price: 'Giá',\n    halfDay: 'NỬA NGÀY · SAU 16:00',\n",
              "    customerAcceptedCopy: 'Your desk at Evil Space is confirmed for today.\\nOpen daily 11:00–23:00.\\n\\nYou can cancel here anytime if your plans change.',": "    customerAcceptedCopy: 'Your desk at Evil Space is confirmed.\\nOpen daily 11:00–23:00.\\n\\nYou can cancel here anytime if your plans change.',",
              "    customerAcceptedCopy: 'Ваш стол в Evil Space подтверждён на сегодня.\\nРаботаем ежедневно 11:00–23:00.\\n\\nЕсли планы изменятся, бронь можно отменить здесь.',": "    customerAcceptedCopy: 'Ваш стол в Evil Space подтверждён.\\nРаботаем ежедневно 11:00–23:00.\\n\\nЕсли планы изменятся, бронь можно отменить здесь.',",
              "    customerNoBooking: 'You do not have an active desk request today.',": "    customerNoBooking: 'You do not have an active desk request for today or tomorrow.',",
              "    customerNoBooking: 'У вас нет активной брони на сегодня.',": "    customerNoBooking: 'У вас нет активной брони на сегодня или завтра.',",
              "    bookingAlreadyActive: 'You already have an active desk request today.',": "    bookingAlreadyActive: 'You already have an active desk request for this day.',",
              "    bookingAlreadyActive: 'У вас уже есть активный запрос на сегодня.',": "    bookingAlreadyActive: 'У вас уже есть активный запрос на этот день.',",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)

          # createCustomerTelegramLink
          pattern = r'export async function createCustomerTelegramLink\(env, bookingId, rawLanguage = \'en\'\) \{.*?(?=\nexport async function handleWebAcceptBooking\()'
          new = r'''export async function createCustomerTelegramLink(env, bookingId, rawLanguage = 'en') {
  const id = toPositiveInt(bookingId);
  if (!id) return null;
  const now = nowSeconds();
  const booking = await bookingById(env, id);
  if (!booking) return null;
  const serviceDay = Number(booking.service_day ?? 0);
  const expiresAt = Math.min(serviceDay + 86400, now + CUSTOMER_LINK_TTL);
  if (expiresAt <= now) return null;
  const language = normalizeLanguage(rawLanguage);

  const token = randomToken(24);
  const tokenHash = await hashToken(token);
  await env.evil_space.batch([
    env.evil_space
      .prepare('DELETE FROM customer_telegram_link_tokens WHERE booking_id = ? AND used_at IS NULL')
      .bind(id),
    env.evil_space
      .prepare(`
        INSERT INTO customer_telegram_link_tokens
          (token_hash, booking_id, created_at, expires_at, used_at, language)
        VALUES (?, ?, ?, ?, NULL, ?)
      `)
      .bind(tokenHash, id, now, expiresAt, language),
  ]);
  return `https://t.me/${BOT_USERNAME}?start=c_${token}`;
}
'''
          text, count = re.subn(pattern, new.rstrip() + '\n', text, count=1, flags=re.S)
          if count != 1: raise SystemExit('telegram createCustomerTelegramLink mismatch')

          # Cancel record selection gets service-day fields.
          text = text.replace(
              'SELECT id, status, customer_id, accepted_visit_id, created_at\n      FROM booking_requests',
              'SELECT id, status, customer_id, accepted_visit_id, created_at, service_day, amount_vnd\n      FROM booking_requests',
              1,
          )

          # pairCustomer
          pattern = r'async function pairCustomer\(env, user, chatId, token\) \{.*?(?=\nasync function bookViaTelegram\()'
          new = r'''async function pairCustomer(env, user, chatId, token) {
  if (!isReasonableToken(token)) return sendText(env, chatId, 'This booking link is invalid.');
  const tokenHash = await hashToken(token);
  const now = nowSeconds();
  const pending = await env.evil_space
    .prepare(`
      SELECT t.booking_id, t.expires_at, t.language,
             b.id, b.name, b.contact_type, b.contact_value, b.status, b.customer_id,
             b.created_at, b.service_day, b.amount_vnd
      FROM customer_telegram_link_tokens t
      JOIN booking_requests b ON b.id = t.booking_id
      WHERE t.token_hash = ? AND t.used_at IS NULL
    `)
    .bind(tokenHash)
    .first();
  if (!pending || Number(pending.expires_at) <= now) {
    return sendText(env, chatId, 'This booking link expired. Return to evils.space and create a new desk request if needed.');
  }
  if (!isBookableServiceDay(Number(pending.service_day ?? 0), now) || !['new', 'accepted'].includes(pending.status)) {
    return sendText(env, chatId, 'This booking is no longer active.');
  }

  const language = normalizeLanguage(pending.language);
  const identity = telegramBookingIdentity(user);
  const customer = await ensureTelegramCustomer(env, user, identity);
  await upsertCustomerTelegramLink(env, customer.id, user, chatId, language);
  await env.evil_space.batch([
    env.evil_space.prepare('UPDATE booking_requests SET customer_id = ? WHERE id = ?').bind(customer.id, pending.id),
    env.evil_space.prepare('UPDATE customer_telegram_link_tokens SET used_at = ? WHERE token_hash = ?').bind(now, tokenHash),
  ]);

  if (pending.status === 'accepted') {
    await sendCustomerAccepted(env, chatId, pending.id, language);
  } else {
    await sendCustomerPending(env, chatId, pending.id, language, true);
  }
}
'''
          text, count = re.subn(pattern, new.rstrip() + '\n', text, count=1, flags=re.S)
          if count != 1: raise SystemExit('telegram pairCustomer mismatch')

          # bookViaTelegram
          pattern = r'async function bookViaTelegram\(env, user, chatId, rawLanguage\) \{.*?(?=\nfunction telegramBookingIdentity\()'
          new = r'''async function bookViaTelegram(env, user, chatId, rawPayload) {
  const now = nowSeconds();
  let language = 'en';
  let serviceDay = null;
  const match = /^(\d{8})_(en|ru|vi)$/.exec(String(rawPayload ?? ''));
  if (match) {
    serviceDay = serviceDayFromCompactDate(match[1]);
    language = normalizeLanguage(match[2]);
  } else {
    language = normalizeLanguage(rawPayload);
    serviceDay = serviceDayForOffset(0, now);
  }
  if (serviceDay == null || !isBookableServiceDay(serviceDay, now)) {
    return sendText(env, chatId, 'This booking date is no longer available. Return to evils.space and choose today or tomorrow.');
  }

  const identity = telegramBookingIdentity(user);
  const customer = await ensureTelegramCustomer(env, user, identity);
  await upsertCustomerTelegramLink(env, customer.id, user, chatId, language);

  const existing = await env.evil_space
    .prepare(`
      SELECT id, status
      FROM booking_requests
      WHERE customer_id = ?
        AND service_day = ?
        AND status IN ('new', 'processing', 'accepted')
      ORDER BY id DESC
      LIMIT 1
    `)
    .bind(customer.id, serviceDay)
    .first();

  if (existing?.id) {
    if (existing.status === 'accepted') {
      await sendCustomerAccepted(env, chatId, existing.id, language);
    } else {
      await sendCustomerPending(env, chatId, existing.id, language);
    }
    return;
  }

  const capacity = await serviceDayCapacity(env, serviceDay);
  if (capacity.occupied >= capacity.total) {
    return sendText(env, chatId, 'No desks are left for this day.');
  }

  const amountVnd = dayPassAmount(serviceDay, now);
  const created = await env.evil_space
    .prepare(`
      INSERT INTO booking_requests
        (name, contact_type, contact_value, status, created_at, customer_id,
         service_day, amount_vnd)
      VALUES (?, 'telegram', ?, 'new', ?, ?, ?, ?)
      RETURNING id
    `)
    .bind(identity.name, identity.contact, now, customer.id, serviceDay, amountVnd)
    .first();
  if (!created?.id) throw new Error('Could not create Telegram booking.');

  await Promise.all([
    notifyAdminsNewBooking(env, created.id),
    sendCustomerPending(env, chatId, created.id, language),
  ]);
}
'''
