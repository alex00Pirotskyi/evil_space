name: Implement two-day booking

on:
  push:
    branches:
      - feature/kindle-admin-foundation
    paths:
      - .github/workflows/implement-two-day-booking.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kindle-admin-foundation
          fetch-depth: 0
      - name: Recover and run implementation patch
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          source = subprocess.check_output([
              'git', 'show',
              '37f915bf97feb05f8ece308b22e2cb8cc1d623de:.github/workflows/implement-two-day-booking.yml',
          ], text=True)
          lines = source.splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          patch = []
          for line in lines[start:end]:
              patch.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(patch) + '\n'
          script = script.replace(
              "re.subn(pattern, new.rstrip() + '\\n', text, count=1, flags=re.S)",
              "re.subn(pattern, lambda _: new.rstrip() + '\\n', text, count=1, flags=re.S)",
          )
          script = script.replace(
              "text = replace_once(text, old, new, 'admin booking groups')",
              "block_start = text.index('      if (snapshot.bookingRequests.isNotEmpty) ...[')\n          block_end = text.index(\"      const SizedBox(height: 28),\\n      _sectionTitle(t('СЕГОДНЯ', 'TODAY'))\", block_start)\n          text = text[:block_start] + new + text[block_end:]",
          )
          Path('/tmp/two_day_patch.py').write_text(script)
          PY
          python3 /tmp/two_day_patch.py
      - name: Verify patched sources
        run: |
          node --check worker/booking_rules.js
          node --check worker/entry.js
          node --check worker/index.js
          node --check worker/telegram.js
          node --test worker/booking_rules_test.mjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/entry.js worker/index.js worker/telegram.js lib/coworking_model.dart lib/public_desk_models.dart lib/public_desk_web.dart lib/app_shell.dart lib/localization.dart assets/content/status.json lib/admin_api_models.dart lib/admin_screen.dart .github/workflows/web-ci.yml test/booking_service_day_contract_test.dart
          git rm .github/workflows/implement-two-day-booking.yml
          git commit -m "Add today and tomorrow desk booking operations"
          git push origin HEAD:feature/kindle-admin-foundation
