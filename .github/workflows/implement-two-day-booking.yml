              'manual day pass price',
          )
          old_query = """        SELECT id, name, contact_type, contact_value, status, created_at
        FROM booking_requests
        WHERE status = 'new'
        ORDER BY created_at DESC, id DESC
        LIMIT 100
      `)
      .all(),"""
          new_query = """        SELECT id, name, contact_type, contact_value, status, created_at,
               service_day, amount_vnd, handled_at, handled_by_email
        FROM booking_requests
        WHERE service_day >= ? AND service_day < ?
          AND (status = 'new' OR (status = 'accepted' AND service_day >= ?))
        ORDER BY service_day ASC, created_at DESC, id DESC
        LIMIT 100
      `)
      .bind(start, end + 86400, end)
      .all(),"""
          text = replace_once(text, old_query, new_query, 'operations booking query')
          path.write_text(text)

          # worker/telegram.js
          path = Path('worker/telegram.js')
          text = path.read_text()
          text = """import {
  DAY_PASS_VND,
  HALF_DAY_VND,
