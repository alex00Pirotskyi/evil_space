          text = text.replace(
              "      _row(t('ДНЕВНОЙ ПРОПУСК', 'DAY PASS'), '', '200K VND'),\n",
              "      _row(t('ДНЕВНОЙ ПРОПУСК', 'DAY PASS'), '', '200K VND'),\n      _row(t('ПОЛДНЯ · ПОСЛЕ 16:00', 'HALF DAY · AFTER 16:00'), '', '100K VND'),\n",
              1,
          )
          path.write_text(text)

          # CI runs both node test suites.
          path = Path('.github/workflows/web-ci.yml')
          text = path.read_text()
          text = text.replace(
              '      - name: Test Telegram bot helpers\n        run: node --test worker/telegram_test.mjs\n',
              '      - name: Test Worker booking and Telegram helpers\n        run: node --test worker/telegram_test.mjs worker/booking_rules_test.mjs\n',
              1,
          )
          text = text.replace(
              '          node --check worker/telegram.js\n',
              '          node --check worker/telegram.js\n          node --check worker/booking_rules.js\n',
              1,
          )
          path.write_text(text)

          # Dart contract test.
          Path('test/booking_service_day_contract_test.dart').write_text(r'''import 'dart:io';

