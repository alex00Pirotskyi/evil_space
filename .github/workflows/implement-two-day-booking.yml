name: Finalize two-day booking

on:
  push:
    branches:
      - feature/kindle-admin-foundation
    paths:
      - .github/workflows/implement-two-day-booking.yml

permissions:
  contents: write

jobs:
  verify-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kindle-admin-foundation
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Remove superseded single-booking block
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/app_shell.dart')
          text = path.read_text()
          marker = '  Future<void> _launchTelegramBooking() async {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('legacy booking block was not found')
          end = text.find('  @override\n  Widget build(BuildContext context)', start)
          if end < 0:
              raise SystemExit('end of legacy booking block was not found')
          path.write_text(text[:start] + text[end:])
          PY
          dart format lib/app_shell.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Worker and booking rules
        run: |
          node --check worker/index.js
          node --check worker/entry.js
          node --check worker/telegram.js
          node --check worker/booking_rules.js
          node --test worker/telegram_test.mjs worker/booking_rules_test.mjs

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build optimized Wasm web
        run: flutter build web --release --wasm --no-pub --dart-define=EVIL_SPACE_ADMIN_PREVIEW=true

      - name: Verify release
        run: |
          node --check build/web/flutter_bootstrap.js
          dart run tool/verify_release.dart build/web

      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app_shell.dart
          git commit -m "Finalize two-day booking client flow"
          git push origin HEAD:feature/kindle-admin-foundation
