name: Fix Telegram customer cancel confirmation

on:
  push:
    branches:
      - feature/kindle-admin-foundation
    paths:
      - .github/workflows/fix-telegram-cancel-confirmation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kindle-admin-foundation
      - name: Patch customer cancellation flow
        run: python3 .github/fix_telegram_cancel.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/telegram.js test/telegram_contract_test.dart
          git rm .github/fix_telegram_cancel.py
          git rm .github/workflows/fix-telegram-cancel-confirmation.yml
          git commit -m "Require confirmation before Telegram booking cancellation"
          git push origin HEAD:feature/kindle-admin-foundation
