name: Web CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Analyze, test, build web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify lockfile is current
        run: git diff --exit-code -- pubspec.lock

      - name: Check Worker syntax
        run: |
          node --check worker/index.js
          node --check worker/entry.js

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release --dart-define=EVIL_SPACE_ADMIN_PREVIEW=true

      - name: Report web bundle size
        run: |
          echo "main.dart.js bytes: $(wc -c < build/web/main.dart.js)"
          echo "main.dart.js gzip bytes: $(gzip -c build/web/main.dart.js | wc -c)"
          du -sh build/web
