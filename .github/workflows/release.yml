name: Production release

on:
  workflow_dispatch:
  # Publish root search metadata, redirects and sitemap changes on main.
  # Other Flutter app releases remain manual.
  push:
    branches:
      - main
    paths:
      - 'seo/share.png'
      - 'tool/build_seo.mjs'
      - 'worker/seo_pages.js'
      - 'wrangler.toml'
      - 'web/index.html'

permissions:
  contents: read

concurrency:
  group: evil-space-production-deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets before releasing.'
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Check lockfile
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Build, test and deploy Flutter app, Worker and SEO pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: dart run tool/release.dart

      - name: Verify public URLs after deployment
        run: |
          set -eu
          test "$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code}' https://evils.space/)" = 200
          test "$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code}' https://evils.space/menu)" = 200
          test "$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' https://evils.space/seo-route-check-404)" = 404
          test "$(curl -sS --max-time 20 -o /dev/null -w '%{http_code} %{redirect_url}' https://evils.space/en/)" = '301 https://evils.space/'
