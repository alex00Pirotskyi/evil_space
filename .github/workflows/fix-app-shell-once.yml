name: Finalize app_shell fix

on:
  push:
    branches:
      - feature/kindle-admin-foundation
    paths:
      - .github/workflows/fix-app-shell-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kindle-admin-foundation

      - name: Remove final unused helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/app_shell.dart')
          text = path.read_text(encoding='utf-8')
          start_marker = '  SitePrice _priceFor(String key) {'
          end_marker = '  String _updatedLabel(String raw) {'
          if start_marker not in text:
              raise SystemExit('_priceFor helper not found')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + text[end:]
          if '_priceFor(' in text:
              raise SystemExit('_priceFor still present')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Commit final repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app_shell.dart
          git commit -m "Remove unused booking price helper"
          git push origin HEAD:feature/kindle-admin-foundation
