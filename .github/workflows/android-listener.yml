name: Android Payment Listener APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'android/**'
      - 'lib/payment_listener_main.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-listener.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'lib/payment_listener_main.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-listener.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter build apk --release --target lib/payment_listener_main.dart
      - uses: actions/upload-artifact@v4
        with:
          name: evil-space-sapo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
