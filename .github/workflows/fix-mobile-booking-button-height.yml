name: Fix mobile booking button height

on:
  push:
    branches:
      - feature/kindle-admin-foundation
    paths:
      - .github/workflows/fix-mobile-booking-button-height.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kindle-admin-foundation

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Equalize booking button heights
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/app_shell.dart')
          text = path.read_text()
          start_marker = "\n        Row(\n          children: [\n            Expanded(\n              child: _PaperButton(\n                label: widget.localization.t('booking_today'),"
          end_marker = "\n        if (status.todayPromoDescription.isNotEmpty)"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('booking row start not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('booking row end not found')
          block = text[start:end]
          block = block.replace(
              "\n        Row(\n",
              "\n        IntrinsicHeight(\n          child: Row(\n            crossAxisAlignment: CrossAxisAlignment.stretch,\n",
              1,
          )
          block += "\n        ),"
          path.write_text(text[:start] + block + text[end:])
          PY
          dart format lib/app_shell.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app_shell.dart
          git commit -m "Equalize mobile booking button heights"
          git push origin HEAD:feature/kindle-admin-foundation
