name: Fix mobile booking button height

on:
  push:
    branches:
      - feature/kindle-admin-foundation
    paths:
      - .github/workflows/fix-mobile-booking-button-height.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kindle-admin-foundation

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Equalize booking button heights
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/app_shell.dart')
          text = path.read_text()
          old = '''        Row(
          children: [
            Expanded(
              child: _PaperButton(
                label: widget.localization.t('booking_today'),
                detail: _bookingBusy ? '…' : _moneyLabel(status.todayPrice),
                icon: Icons.today_outlined,
                filled: true,
                onPressed:
                    _bookingBusy || todayBooking != null || status.free <= 0
                    ? null
                    : () => _requestDesk(todayDate),
              ),
            ),
            Expanded(
              child: _PaperButton(
                label: widget.localization.t('booking_tomorrow'),
                detail: _bookingBusy
                    ? '…'
                    : '${_moneyLabel(status.tomorrowPrice)} · ${status.tomorrowFree} ${widget.localization.t('free_short')}',
                icon: Icons.event_outlined,
                onPressed:
                    _bookingBusy ||
                        tomorrowBooking != null ||
                        status.tomorrowFree <= 0
                    ? null
                    : () => _requestDesk(tomorrowDate),
              ),
            ),
          ],
        ),'''
          new = '''        IntrinsicHeight(
          child: Row(
            crossAxisAlignment: CrossAxisAlignment.stretch,
            children: [
              Expanded(
                child: _PaperButton(
                  label: widget.localization.t('booking_today'),
                  detail: _bookingBusy ? '…' : _moneyLabel(status.todayPrice),
                  icon: Icons.today_outlined,
                  filled: true,
                  onPressed:
                      _bookingBusy || todayBooking != null || status.free <= 0
                      ? null
                      : () => _requestDesk(todayDate),
                ),
              ),
              Expanded(
                child: _PaperButton(
                  label: widget.localization.t('booking_tomorrow'),
                  detail: _bookingBusy
                      ? '…'
                      : '${_moneyLabel(status.tomorrowPrice)} · ${status.tomorrowFree} ${widget.localization.t('free_short')}',
                  icon: Icons.event_outlined,
                  onPressed:
                      _bookingBusy ||
                          tomorrowBooking != null ||
                          status.tomorrowFree <= 0
                      ? null
                      : () => _requestDesk(tomorrowDate),
                ),
              ),
            ],
          ),
        ),'''
          if old not in text:
              raise SystemExit('booking button row not found')
          path.write_text(text.replace(old, new, 1))
          PY
          dart format lib/app_shell.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app_shell.dart
          git commit -m "Equalize mobile booking button heights"
          git push origin HEAD:feature/kindle-admin-foundation
