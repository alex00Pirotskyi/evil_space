name: Refresh lockfile

on:
  push:
    branches:
      - agent/evil-space-refresh-lock
    paths:
      - '.github/workflows/refresh-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Refresh lockfile
        run: flutter pub get

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pubspec.lock
          git commit -m "Refresh Flutter lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
