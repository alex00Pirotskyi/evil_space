name = "evil-space"
main = "worker/secure_entry.js"
compatibility_date = "2026-08-29"

[assets]
directory = "./build/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[routes]]
pattern = "evils.space"
custom_domain = true

[[d1_databases]]
binding = "evil_space"
database_name = "evil-space"
database_id = "ba5e5254-e34a-4bca-9127-1872faa0d001"
migrations_dir = "migrations"

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "486217001"

  [ratelimits.simple]
  limit = 8
  period = 60

[[ratelimits]]
name = "PUBLIC_BOOKING_RATE_LIMITER"
namespace_id = "486217002"

  [ratelimits.simple]
  limit = 6
  period = 60

[[send_email]]
name = "ADMIN_EMAIL"
destination_address = "evilssspace79@gmail.com"
